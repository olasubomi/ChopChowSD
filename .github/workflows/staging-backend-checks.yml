name: Staging backend checks

on:
  push:
    branches: [staging-main]
  pull_request:
    branches: [staging-main, master]

permissions:
  contents: read

jobs:
  gmail-transport-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --force --ignore-scripts
      - name: Test Gmail API transport with mocked network
        run: node --test tests/gmailApiTransport.test.js

name: One-time staging lockfile repair

on:
  push:
    branches: [docs/ccd-496-release-workflow]
    paths: [.github/workflows/ccd-497-refresh-lockfile.yml, package-lock.json]

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Verify reproducible clean install
        run: npm ci --force --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Review lockfile-only change
        run: |
          git diff --check
          git diff --stat -- package-lock.json
          test -z "$(git status --porcelain -- package.json)"
      - name: Commit regenerated lockfile to staging PR branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize backend package lockfile"
          git push origin HEAD:docs/ccd-496-release-workflow

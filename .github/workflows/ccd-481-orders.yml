name: CCD-481 order foundations

on:
  push:
    branches:
      - feature/ccd-481-multisupplier-orders
  pull_request:
    paths:
      - 'services/checkoutGrouping.js'
      - 'model/order.js'
      - 'model/orderGroup.js'
      - 'model/checkoutGroup.js'
      - 'test/checkoutGrouping.test.js'
      - 'services/inventoryMigrationPlan.js'
      - 'services/inventoryAvailability.js'
      - 'model/storeInventoryV2.js'
      - 'test/inventoryAvailability.test.js'
      - 'test/inventoryMigrationPlan.test.js'
      - 'scripts/auditInventoryReadOnly.js'
      - 'docs/ccd-481-live-inventory-audit.md'
      - 'services/storeAccess.js'
      - 'services/safeManagementUpdates.js'
      - 'utils/storeAccessMiddleware.js'
      - 'routes/store.js'
      - 'routes/user.js'
      - 'controllers/StoreController/store.controller.js'
      - 'controllers/UserController/userController.js'
      - 'repository/store.js'
      - 'test/storeAccess.test.js'
      - 'test/safeManagementUpdates.test.js'
      - '.github/workflows/ccd-481-orders.yml'

jobs:
  checkout-foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check source syntax
        run: |
          node --check services/checkoutGrouping.js
          node --check services/inventoryMigrationPlan.js
          node --check services/inventoryAvailability.js
          node --check model/storeInventoryV2.js
          node --check scripts/auditInventoryReadOnly.js
          node --check model/order.js
          node --check model/orderGroup.js
          node --check model/checkoutGroup.js
          node --check services/storeAccess.js
          node --check services/safeManagementUpdates.js
          node --check utils/storeAccessMiddleware.js
          node --check routes/store.js
          node --check routes/user.js
          node --check controllers/StoreController/store.controller.js
          node --check controllers/UserController/userController.js
          node --check repository/store.js
      - name: Run offline supplier grouping tests
        run: node --test test/checkoutGrouping.test.js test/inventoryMigrationPlan.test.js test/inventoryAvailability.test.js test/storeAccess.test.js test/safeManagementUpdates.test.js

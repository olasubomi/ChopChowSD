name: Credential Login Security

on:
  pull_request:
    paths:
      - 'services/credentialLogin.js'
      - 'services/UserService.js'
      - 'controllers/UserController/userController.js'
      - 'test/credentialLogin.test.js'
      - '.github/workflows/credential-login-security.yml'
  push:
    branches:
      - hotfix/require-password-authentication

jobs:
  credential-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check services/credentialLogin.js
          node --check services/UserService.js
          node --check controllers/UserController/userController.js
      - name: Regression tests
        run: node --test test/credentialLogin.test.js

name: Staging password reset smoke test

on:
  push:
    branches:
      - staging/ccd-490-password-reset
    paths:
      - .github/workflows/staging-password-reset-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Exercise isolated staging signup and forgot-password API
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const base = 'https://chopchowserver2.onrender.com/api/user';
          const email = 'olasubomiawokoya@gmail.com';
          async function post(path, data) {
            const res = await fetch(base + path, {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(data),
              signal: AbortSignal.timeout(45000)
            });
            console.log(path + ': HTTP ' + res.status);
            return res;
          }
          (async () => {
            const signup = await post('/signup', {
              email,
              first_name: 'Staging',
              last_name: 'Test',
              username: 'staging_mailer_test',
              password: crypto.randomBytes(24).toString('hex'),
              isSubscribed: false,
              email_notifications: false
            });
            if (signup.status < 200 || signup.status >= 300) {
              console.error('Staging signup failed; no password reset sent.');
              process.exitCode = 1;
              return;
            }
            const forgot = await post('/forgotpassword', { email });
            if (forgot.status < 200 || forgot.status >= 300) {
              console.error('Staging forgot-password request failed.');
              process.exitCode = 1;
              return;
            }
            console.log('Staging reset request accepted. Check Gmail inbox for delivery.');
          })().catch(err => {
            console.error('Smoke test failed:', err.message);
            process.exitCode = 1;
          });
          NODE
